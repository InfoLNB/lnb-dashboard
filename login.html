<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion LNB</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div class="login-container">
    <img src="assets/images/lnb-logo.png" alt="Logo LNB" />
    <h2>Connexion LNB</h2>
    <form id="loginForm">
      <input type="text" id="username" placeholder="Nom d'utilisateur" required />
      <input type="password" id="password" placeholder="Mot de passe" required />
      <button type="submit">Se connecter</button>
    </form>
    <p id="loginError" class="error" style="display:none">Identifiants incorrects</p>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', e => {
      e.preventDefault();
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      if (u==='AdminBB' && p==='BrianBasile83!') { location.href='admin-dashboard.html'; return; }
      if (/^(YACHTING|PAINTING|COVER)\d+$/.test(u) && p.startsWith('employepass')) {
        location.href='employee-dashboard.html'; return;
      }
      document.getElementById('loginError').style.display='block';
    });
  </script>
</body>
</html>
