
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Ajouter un projet - LNB GROUP</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 2rem; }
    .container {
      background: white; max-width: 900px; margin: auto;
      padding: 2rem; border-radius: 8px; box-shadow: 0 1px 6px rgba(0,0,0,0.1);
    }
    h2 { margin-bottom: 1rem; }
    label { font-weight: bold; margin-top: 1rem; display: block; }
    input, select, textarea {
      width: 100%; padding: 0.5rem; margin-top: 0.3rem;
      border: 1px solid #ccc; border-radius: 6px;
    }
    button {
      margin-top: 2rem; padding: 0.75rem 1.5rem; background: #003B5C;
      color: white; border: none; border-radius: 6px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🆕 Ajouter un Projet</h2>
    <form id="projectForm">
      <label for="clientName">Nom du client</label>
      <input type="text" id="clientName" name="clientName">

      <label for="bateau">Nom du bateau</label>
      <input type="text" id="bateau" name="bateau">

      <label for="typeBateau">Type de bateau</label>
      <input type="text" id="typeBateau" name="typeBateau">

      <label for="marque">Marque</label>
      <input type="text" id="marque" name="marque">

      <label for="lieu">Lieu d’intervention</label>
      <input type="text" id="lieu" name="lieu">

      <label for="gps">Position GPS</label>
      <input type="text" id="gps" name="gps" placeholder="Auto ou saisie manuelle">

      <label for="remarques">Remarques / Covering existant</label>
      <textarea id="remarques" rows="3"></textarea>

      <label for="typeFacturation">Facturation</label>
      <select id="typeFacturation">
        <option value="HT">HT</option>
        <option value="TTC">TTC</option>
      </select>

      <label for="docs">📎 Documents projet (PDF, devis, immatriculation)</label>
      <input type="file" id="docs" name="docs" multiple accept="application/pdf">

      <label for="photos">📷 Photos (avant projet)</label>
      <input type="file" id="photos" name="photos" multiple accept="image/*">

      <button type="submit">Créer le projet</button>
    </form>
  </div>
</body>
</html>
