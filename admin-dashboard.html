
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Admin - LNB GROUP</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <aside>
    <img src="lnb-logo.png" alt="LNB Logo" style="width: 80px;" />
    <nav>
      <ul>
        <li><img src="Logo 2.svg" style="height:20px;"/> Yachting</li>
        <li><img src="Logo 6.svg" style="height:20px;"/> Painting</li>
        <li><img src="logo 7.svg" style="height:20px;"/> Cover</li>
        <li><img src="logo 8.svg" style="height:20px;"/> Cleaning</li>
      </ul>
    </nav>
  </aside>
  <main>
    <header>
      <h1>LNB GROUP APP</h1>
      <button id="open-form">➕</button>
    </header>

    <section class="stats">
      <div><strong>CA Mensuel</strong><br><em>Pas encore de données</em></div>
      <div><strong>Heures Trav.</strong><br><em>Pas encore de données</em></div>
      <div><strong>Devis</strong><br><em>0 créé</em></div>
      <div><strong>Factures</strong><br><em>0 envoyée</em></div>
    </section>

    <section id="projects">
      <div class="project">
        <h3>Projet Yacht</h3>
        <p>Activité: Yachting</p>
        <button onclick="archiveProject(this)">🗑 Archiver</button>
      </div>
    </section>

    <h2>📁 Archives</h2>
    <section id="archives"></section>
  </main>
  <script>
    function archiveProject(btn) {
      const card = btn.parentElement;
      card.classList.add("archived");
      document.getElementById("archives").appendChild(card);
      btn.remove();
    }
  </script>
</body>
</html>
