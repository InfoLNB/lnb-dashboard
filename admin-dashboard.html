
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>LNB GROUP APP</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <aside>
    <img src="lnb-logo.png" alt="Logo LNB" style="width: 60px;" />
    <nav>
      <ul>
        <li><a href="#">Yachting</a></li>
        <li><a href="#">Painting</a></li>
        <li><a href="#">Cover</a></li>
      </ul>
    </nav>
  </aside>

  <main>
    <header>
      <h1>LNB GROUP APP</h1>
      <button id="open-form">+</button>
      <span>🔔</span>
    </header>

    <section class="stats">
      <div><strong>CA Mensuel</strong><br>54 200 €</div>
      <div><strong>Heures Trav.</strong><br>318 h</div>
      <div><strong>Devis</strong><br>12 créés</div>
      <div><strong>Factures</strong><br>9 envoyées</div>
    </section>

    <section class="projects">
      <h2>📁 Projets en cours</h2>
      <article>
        <h3>Yacht Sunrise</h3>
        <p>Client : M. Durand<br>Activité : Yachting<br>👤 Basile, Brian</p>
        <span style="color:green;">🟢 Terminé</span>
      </article>
    </section>
  </main>

  <dialog id="modal-form">
    <div id="modal-content"></div>
    <button id="close-modal">Fermer</button>
  </dialog>

  <script>
    const openFormBtn = document.getElementById('open-form');
    const modal = document.getElementById('modal-form');
    const modalContent = document.getElementById('modal-content');
    const closeModalBtn = document.getElementById('close-modal');

    openFormBtn.addEventListener('click', async () => {
      const response = await fetch('formulaire-intervention.html');
      const formHtml = await response.text();
      modalContent.innerHTML = formHtml;
      modal.showModal();
    });

    closeModalBtn.addEventListener('click', () => {
      modal.close();
    });
  </script>
</body>
</html>
