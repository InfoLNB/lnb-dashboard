
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - LNB</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #f4f6f8;
      color: #333;
    }
    header {
      background: #002f4b;
      color: #fff;
      padding: 1rem;
      font-size: 1.2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .sidebar {
      width: 220px;
      background: #003b5c;
      color: white;
      height: 100vh;
      position: fixed;
      padding-top: 2rem;
    }
    .sidebar ul {
      list-style: none;
      padding: 0;
    }
    .sidebar li {
      padding: 1rem 2rem;
      cursor: pointer;
    }
    .sidebar li:hover {
      background-color: #004b6e;
    }
    .main {
      margin-left: 220px;
      padding: 2rem;
    }
    h2 {
      font-size: 1.5rem;
      color: #004466;
      margin-bottom: 1rem;
    }
    .card {
      background: white;
      padding: 1rem;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      margin-bottom: 1rem;
    }
    @media (max-width: 768px) {
      .sidebar { width: 100%; position: relative; height: auto; }
      .main { margin-left: 0; padding: 1rem; }
    }
  </style>
</head>
<body>
  <header>
    <span>LNB Yachting - Admin</span>
    <span>🔔 +</span>
  </header>
  <div class="sidebar">
    <ul>
      <li>📊 Statistiques</li>
      <li>📅 Planning</li>
      <li>📁 Projets</li>
      <li>👤 Clients</li>
    </ul>
  </div>
  <div class="main">
    <h2>Vue d'ensemble</h2>
    <div class="card">
      <strong>Projet Yacht Sunrise</strong><br>
      Client : M. Durand — Avancement : 80%
    </div>
    <div class="card">
      <strong>Projet Villa Lumière</strong><br>
      Client : Mme Marchand — Avancement : 45%
    </div>
  </div>
</body>
</html>
