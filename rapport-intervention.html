
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Rapport Intervention - LNB</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f8f9fa;
      color: #001f3f;
    }
    .form-container {
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      max-width: 800px;
      margin: auto;
    }
    input, textarea, select, button {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
    }
    img.preview {
      max-width: 100%;
      max-height: 200px;
      display: block;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>📝 Rapport d'intervention LNB</h2>
    <input type="text" id="projet" placeholder="Nom du projet / bateau">
    <textarea id="description" rows="3" placeholder="Description de l'intervention"></textarea>
    <input type="file" id="photoAvant" accept="image/*" onchange="previewImage(this, 'previewAvant')">
    <img id="previewAvant" class="preview" src="#" alt="Photo avant" style="display:none;">
    <input type="file" id="photoApres" accept="image/*" onchange="previewImage(this, 'previewApres')">
    <img id="previewApres" class="preview" src="#" alt="Photo après" style="display:none;">
    <button onclick="exportPDF()">📄 Générer le PDF</button>
  </div>

  <script>
    function previewImage(input, imgId) {
      const img = document.getElementById(imgId);
      const file = input.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = e => {
          img.src = e.target.result;
          img.style.display = 'block';
        };
        reader.readAsDataURL(file);
      }
    }

    async function exportPDF() {
      const {{ jsPDF }} = window.jspdf;
      const doc = new jsPDF();

      const projet = document.getElementById("projet").value;
      const description = document.getElementById("description").value;
      const avant = document.getElementById("previewAvant").src;
      const apres = document.getElementById("previewApres").src;

      doc.setFontSize(14);
      doc.text("Rapport d'intervention - LNB", 10, 10);
      doc.setFontSize(12);
      doc.text("Projet : " + projet, 10, 20);
      doc.text("Description :", 10, 30);
      doc.text(doc.splitTextToSize(description, 180), 10, 38);

      if (avant && avant.startsWith("data:image")) {
        doc.text("Photo avant :", 10, 85);
        doc.addImage(avant, "JPEG", 10, 90, 90, 60);
      }

      if (apres && apres.startsWith("data:image")) {
        doc.text("Photo après :", 110, 85);
        doc.addImage(apres, "JPEG", 110, 90, 90, 60);
      }

      doc.save("rapport_LNB.pdf");
    }
  </script>
</body>
</html>
