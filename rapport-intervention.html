
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rapport d’intervention</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f4f6f8;
      padding: 2rem;
      color: #333;
    }
    form {
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.1);
      max-width: 600px;
      margin: auto;
    }
    h2 {
      color: #004466;
      margin-bottom: 1rem;
    }
    label {
      display: block;
      margin-top: 1rem;
      font-weight: bold;
    }
    input, select, textarea {
      width: 100%;
      padding: 0.75rem;
      margin-top: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
    }
    .submit-btn {
      margin-top: 2rem;
      background: #004466;
      color: white;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .submit-btn:hover {
      background: #006699;
    }
  </style>
</head>
<body>
  <form>
    <h2>📝 Rapport d’intervention</h2>
    <label for="project">Nom du projet / bateau</label>
    <input type="text" id="project" name="project" required />

    <label for="client">Nom du client</label>
    <input type="text" id="client" name="client" />

    <label for="type">Type d’intervention</label>
    <select id="type" name="type">
      <option value="Yachting">Yachting</option>
      <option value="Painting">Painting</option>
      <option value="Cover">Cover</option>
      <option value="Cleaning">Cleaning</option>
    </select>

    <label for="description">Description de l’intervention</label>
    <textarea id="description" name="description" rows="4" required></textarea>

    <label for="materials">Matériel utilisé</label>
    <textarea id="materials" name="materials" rows="2"></textarea>

    <label for="hours">Temps d’intervention (en heures)</label>
    <input type="number" id="hours" name="hours" step="0.25" />

    <label for="status">Statut</label>
    <select id="status" name="status">
      <option value="🟢 Terminé">🟢 Terminé</option>
      <option value="🟠 En cours">🟠 En cours</option>
      <option value="🔴 En attente">🔴 En attente</option>
    </select>

    <label for="files">Photos avant/après (PDF ou image)</label>
    <input type="file" id="files" name="files" multiple />

    <label for="gps">📍 Position GPS (lien ou coordonnées)</label>
    <input type="text" id="gps" name="gps" />

    <button class="submit-btn" type="submit">Envoyer</button>
  </form>
</body>
</html>
