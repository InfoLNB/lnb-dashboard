<div class="main-content">
  <!-- CONTENU ICI -->


<div class="form-container">
<h2>📝 Rapport d'intervention LNB</h2>
<input id="projet" placeholder="Nom du projet / bateau" type="text"/>
<textarea id="description" placeholder="Description de l'intervention" rows="3"></textarea>
<input accept="image/*" id="photoAvant" onchange="previewImage(this, 'previewAvant')" type="file"/>
<img alt="Photo avant" class="preview" id="previewAvant" src="#" style="display:none;"/>
<input accept="image/*" id="photoApres" onchange="previewImage(this, 'previewApres')" type="file"/>
<img alt="Photo après" class="preview" id="previewApres" src="#" style="display:none;"/>
<button onclick="exportPDF()">📄 Générer le PDF</button>
</div>
<script>
    function previewImage(input, imgId) {
      const img = document.getElementById(imgId);
      const file = input.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = e => {
          img.src = e.target.result;
          img.style.display = 'block';
        };
        reader.readAsDataURL(file);
      }
    }

    async function exportPDF() {
      const {{ jsPDF }} = window.jspdf;
      const doc = new jsPDF();

      const projet = document.getElementById("projet").value;
      const description = document.getElementById("description").value;
      const avant = document.getElementById("previewAvant").src;
      const apres = document.getElementById("previewApres").src;

      doc.setFontSize(14);
      doc.text("Rapport d'intervention - LNB", 10, 10);
      doc.setFontSize(12);
      doc.text("Projet : " + projet, 10, 20);
      doc.text("Description :", 10, 30);
      doc.text(doc.splitTextToSize(description, 180), 10, 38);

      if (avant && avant.startsWith("data:image")) {
        doc.text("Photo avant :", 10, 85);
        doc.addImage(avant, "JPEG", 10, 90, 90, 60);
      }

      if (apres && apres.startsWith("data:image")) {
        doc.text("Photo après :", 110, 85);
        doc.addImage(apres, "JPEG", 110, 90, 90, 60);
      }

      doc.save("rapport_LNB.pdf");
    }
  </script>

</div>
</body>
