<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Création Client - LNB</title>
</head>
<body>

<!-- Menu Burger (commun à toutes les pages LNB) -->

    height: 100vh;

  }

    margin-left: 240px;

<div class="sidebar">
  <h2>LNB Dashboard</h2>
  <a href="dashboard.html">🏠 Accueil</a>
  <a href="admin-dashboard.html">🧭 Admin</a>

<div class="main-content">
  <!-- CONTENU ICI -->


<h1>Ajouter un Client / Projet</h1>
<form id="clientForm">
<label>Type de client :</label>
<select id="clientType" onchange="toggleFields()">
<option value="Particulier">Particulier</option>
<option value="Professionnel">Professionnel</option>
</select>
<div id="fieldsParticulier">
<label>Nom complet :</label>
<input id="nomClient" placeholder="Nom et prénom" type="text"/>
</div>
<div class="hidden" id="fieldsPro">
<label>Raison sociale :</label>
<input id="raisonSociale" placeholder="Nom de l'entreprise" type="text"/>
<label>N° TVA :</label>
<input id="tva" type="text"/>
<label>SIRET :</label>
<input id="siret" type="text"/>
</div>
<label>Nom du projet / bateau :</label>
<input id="projet" type="text"/>
<label>Activité :</label>
<select id="activite">
<option>Yachting</option>
<option>Painting</option>
<option>Cover</option>
<option>Cleaning</option>
</select>
<label>Adresse :</label>
<input id="adresse" type="text"/>
<label>Téléphone :</label>
<input id="telephone" type="tel"/>
<label>Commentaires / notes :</label>
<textarea id="notes" rows="3"></textarea>
<button onclick="ajouterClient()" type="button">Ajouter</button>
<button onclick="exporterExcel()" type="button">Exporter en Excel</button>
<button onclick="envoyerEmail()" type="button">📧 Envoyer à LNB</button>
<button onclick="envoyerEmail()" type="button">Envoyer à LNB</button>
</form>
<div style="max-width: 1000px; margin: auto;">
<table id="clientTable">
<thead>
<tr>
<th>Type</th>
<th>Client</th>
<th>Projet</th>
<th>Activité</th>
<th>Téléphone</th>
<th>Notes</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>
<script>
let clients = [];

function toggleFields() {
  const type = document.getElementById("clientType").value;
  document.getElementById("fieldsPro").classList.toggle("hidden", type !== "Professionnel");
  document.getElementById("fieldsParticulier").classList.toggle("hidden", type !== "Particulier");
}

function ajouterClient() {
  const type = document.getElementById("clientType").value;
  const nom = type === "Professionnel" ? document.getElementById("raisonSociale").value : document.getElementById("nomClient").value;
  const projet = document.getElementById("projet").value;
  const activite = document.getElementById("activite").value;
  const adresse = document.getElementById("adresse").value;
  const telephone = document.getElementById("telephone").value;
  const notes = document.getElementById("notes").value;

  const client = { Type: type, Client: nom, Projet: projet, Activité: activite, Téléphone: telephone, Notes: notes };
  clients.push(client);
  afficherTable();
}

function afficherTable() {
  const tbody = document.querySelector("#clientTable tbody");
  tbody.innerHTML = "";
  clients.forEach(c => {
    const row = `<tr><td>${c.Type}</td><td>${c.Client}</td><td>${c.Projet}</td><td>${c.Activité}</td><td>${c.Téléphone}</td><td>${c.Notes}</td></tr>`;
    tbody.innerHTML += row;
  });
}

function exporterExcel() {
  const ws = XLSX.utils.json_to_sheet(clients);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Clients");
  XLSX.writeFile(wb, "LNB_Clients.xlsx");
}

function envoyerEmail() {
  let message = "Nouveaux clients enregistrés :\n\n";
  clients.forEach((c, i) => {
    message += `Client ${i + 1} - ${c.Type}\nNom: ${c.Client}\nProjet: ${c.Projet}\nActivité: ${c.Activité}\nTéléphone: ${c.Téléphone}\nNotes: ${c.Notes}\n\n`;
  });
  const mailtoLink = `mailto:info@lnb-yachting.com?subject=Clients LNB&body=${encodeURIComponent(message)}`;
  window.location.href = mailtoLink;
}

function envoyerEmail() {
  const type = document.getElementById("clientType").value;
  const nom = type === "Professionnel" ? document.getElementById("raisonSociale").value : document.getElementById("nomClient").value;
  const projet = document.getElementById("projet").value;
  const activite = document.getElementById("activite").value;
  const adresse = document.getElementById("adresse").value;
  const telephone = document.getElementById("telephone").value;
  const notes = document.getElementById("notes").value;

  const body = encodeURIComponent(
    `Type: ${type}%0D%0AClient: ${nom}%0D%0AProjet: ${projet}%0D%0AActivité: ${activite}%0D%0AAdresse: ${adresse}%0D%0ATéléphone: ${telephone}%0D%0ANotes: ${notes}`
  );
  const mailto = `mailto:info@lnb-yachting.com?subject=Fiche client LNB - ${projet}&body=${body}`;
  window.location.href = mailto;
}
</script>

</div>
</body>
</html>
