
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tableau de bord Employé - LNB</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background: #eef2f5;
      color: #333;
    }
    header {
      background-color: #002f4b;
      color: white;
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .content {
      padding: 2rem;
    }
    h2 {
      color: #004466;
      margin-bottom: 1rem;
    }
    .task {
      background: white;
      padding: 1rem;
      margin-bottom: 1rem;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      position: relative;
    }
    .task img {
      position: absolute;
      top: 12px;
      right: 12px;
      height: 24px;
    }
    footer {
      background: #002f4b;
      color: white;
      text-align: center;
      padding: 1rem;
      margin-top: 2rem;
    }
  </style>
</head>
<body>
  <header>
    <span>👷 Interventions Assignées</span>
    <img src="lnb-logo.png" alt="LNB Logo" style="height: 40px;">
  </header>
  <div class="content">
    <h2>Planning</h2>
    <div class="task">
      Lundi 6 mai – Yacht Azur<br/>
      Nettoyage pont + inspection
      <img src="Logo 2.svg" alt="Yachting">
    </div>
    <div class="task">
      Mercredi 8 mai – Villa Lumière<br/>
      Pose film PPF - 2h
      <img src="logo 7.svg" alt="Cover">
    </div>
  </div>
  <footer>
    LNB GROUP – info@lnb-yachting.com
  </footer>
</body>
</html>
