
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Détail du projet - LNB GROUP</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; padding: 2rem; background: #f4f4f4; }
    .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 1px 6px rgba(0,0,0,0.1); max-width: 700px; margin: auto; }
    h2 { color: #004466; }
    label { font-weight: bold; display: block; margin-top: 1rem; }
    input, textarea, select { width: 100%; padding: 0.5rem; margin-top: 0.5rem; border-radius: 6px; border: 1px solid #ccc; }
    .status { font-weight: bold; margin-top: 1rem; }
    .btn { background: #004466; color: white; padding: 0.75rem 1.5rem; margin-top: 2rem; border: none; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🔍 Fiche Projet</h2>
    <p><strong>Nom du projet :</strong> Yacht Sunrise</p>
    <p><strong>Client :</strong> M. Durand</p>
    <p><strong>Date de création :</strong> 02/05/2025</p>

    <label for="desc">Description</label>
    <textarea id="desc" rows="4">Nettoyage complet + polissage coque</textarea>

    <label for="notes">Notes internes</label>
    <textarea id="notes" rows="3">Prévoir matériel spécial zone arrière</textarea>

    <label for="status">Statut du projet</label>
    <select id="status">
      <option value="devis">📄 En devis</option>
      <option value="attente">🟡 En attente de validation</option>
      <option value="accepte">✅ Accepté</option>
      <option value="encours" selected>🔨 En cours</option>
      <option value="termine">🏁 Terminé</option>
    </select>

    <button class="btn" onclick="alert('Modifications enregistrées')">💾 Enregistrer</button>
  </div>
</body>
</html>
